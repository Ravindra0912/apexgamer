<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>apexgamer — Games (mockup)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .line-clamp-2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .line-clamp-3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 antialiased">

  <header class="border-b border-neutral-900 bg-neutral-950/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-gradient-to-br from-fuchsia-500 to-indigo-500"></div>
        <span class="font-semibold tracking-tight">apexgamer</span>
      </div>
      <nav class="flex items-center gap-6 text-sm text-neutral-400">
        <a class="text-neutral-100" href="#">Games</a>
        <a href="#">Tags</a>
        <a href="#">About</a>
      </nav>
    </div>
  </header>

  <main class="px-6 py-10">

    <div class="max-w-7xl mx-auto mb-8 flex items-end justify-between flex-wrap gap-4">
      <div>
        <h1 class="text-3xl font-semibold tracking-tight">Trending games</h1>
        <p class="text-neutral-400 text-sm mt-1">AI-summarized reviews from Steam, refreshed daily.</p>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span class="text-neutral-500">Sort</span>
        <select class="bg-neutral-900 border border-neutral-800 rounded-md px-3 py-1.5 text-neutral-200">
          <option>Most recent</option>
          <option>Highest rated</option>
          <option>Most reviewed</option>
        </select>
      </div>
    </div>

    <section id="grid" class="max-w-7xl mx-auto grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <!-- tiles injected by JS -->
    </section>

    <div class="max-w-7xl mx-auto mt-10 flex justify-center">
      <button class="px-5 py-2 rounded-md bg-neutral-800 hover:bg-neutral-700 transition text-sm">
        Load more
      </button>
    </div>

  </main>

  <script>
    const games = [
      {
        _id: "1",
        name: "Hollow Spire",
        releaseDate: "2025-11-12",
        backgroundImage: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200&q=80",
        ratings: { metacritic: 89, rawg: 4.5 },
        tags: ["Soulslike", "Atmospheric", "Indie"],
        reviewSummary: {
          pros: ["Tight combat with a satisfying parry system", "Hauntingly beautiful pixel art"],
          cons: ["Steep difficulty curve early on", "Sparse fast-travel network"],
        },
      },
      {
        _id: "2",
        name: "Neon Drift 2087",
        releaseDate: "2025-09-30",
        backgroundImage: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=1200&q=80",
        ratings: { metacritic: 76, rawg: 4.1 },
        tags: ["Racing", "Cyberpunk", "Multiplayer"],
        reviewSummary: {
          pros: ["Best-in-class drift physics", "Stunning rain-slick lighting"],
          cons: ["Thin single-player content", "Aggressive cosmetic monetization"],
        },
      },
      {
        _id: "3",
        name: "Garden of the Lost",
        releaseDate: "2026-02-04",
        backgroundImage: "https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=1200&q=80",
        ratings: { metacritic: 92, rawg: 4.7 },
        tags: ["Cozy", "Farming", "Story-rich"],
        reviewSummary: {
          pros: ["Genuinely moving narrative beats", "Relaxing loop without busywork"],
          cons: ["Inventory UI feels cramped on Steam Deck"],
        },
      },
      {
        _id: "4",
        name: "Voidbreakers",
        releaseDate: "2025-08-22",
        backgroundImage: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=80",
        ratings: { metacritic: 81, rawg: 4.3 },
        tags: ["Roguelike", "Sci-fi", "Co-op"],
        reviewSummary: {
          pros: ["Build variety keeps runs fresh", "Co-op scaling actually works"],
          cons: ["Boss telegraphs can be unreadable", "Long meta-progression grind"],
        },
      },
      {
        _id: "5",
        name: "Atelier of Quiet Things",
        releaseDate: "2026-01-15",
        backgroundImage: "https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200&q=80",
        ratings: { metacritic: 85, rawg: 4.4 },
        tags: ["Puzzle", "Hand-drawn", "Short"],
        reviewSummary: {
          pros: ["Every puzzle teaches a new mechanic cleanly", "Gorgeous watercolor art direction"],
          cons: ["Wraps up in under 6 hours"],
        },
      },
      {
        _id: "6",
        name: "Iron Tide: Harbor Wars",
        releaseDate: "2025-10-07",
        backgroundImage: "https://images.unsplash.com/photo-1551103782-8ab07afd45c1?w=1200&q=80",
        ratings: { metacritic: 72, rawg: 3.9 },
        tags: ["Strategy", "Naval", "Historical"],
        reviewSummary: {
          pros: ["Deep economic systems reward planning", "Mod tools shipped at launch"],
          cons: ["UI hides too much under nested menus", "Tutorial barely covers diplomacy"],
        },
      },
      {
        _id: "7",
        name: "Pulse of the Forge",
        releaseDate: "2025-12-01",
        backgroundImage: "https://images.unsplash.com/photo-1556438064-2d7646166914?w=1200&q=80",
        ratings: { metacritic: 88, rawg: 4.6 },
        tags: ["Rhythm", "Action", "Soundtrack"],
        reviewSummary: {
          pros: ["Soundtrack is an instant classic", "Combat syncs perfectly to the beat"],
          cons: ["Limited difficulty options for newcomers"],
        },
      },
      {
        _id: "8",
        name: "Last Light Outpost",
        releaseDate: "2025-07-19",
        backgroundImage: "https://images.unsplash.com/photo-1542751110-97427bbecf20?w=1200&q=80",
        ratings: { metacritic: 79, rawg: 4.2 },
        tags: ["Survival", "Base-building", "PvE"],
        reviewSummary: {
          pros: ["Tense weather and supply systems", "Smart enemy AI under pressure"],
          cons: ["Mid-game pacing drags", "Occasional save corruption reported"],
        },
      },
    ];

    const ratingColor = (mc) => {
      if (mc >= 85) return "bg-emerald-500/90 text-emerald-50";
      if (mc >= 70) return "bg-amber-500/90 text-amber-50";
      return "bg-rose-500/90 text-rose-50";
    };

    const tileHtml = (g) => `
      <a href="game-detail.html?id=${g._id}"
         class="group rounded-xl overflow-hidden bg-neutral-900 ring-1 ring-neutral-800 hover:ring-neutral-600 transition flex flex-col">
        <div class="relative aspect-[16/9] bg-neutral-800 overflow-hidden">
          <img src="${g.backgroundImage}" alt="${g.name}" loading="lazy"
               class="w-full h-full object-cover group-hover:scale-[1.03] transition duration-500" />
          <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-neutral-900 to-transparent"></div>
          <span class="absolute top-2 right-2 text-[11px] font-semibold px-2 py-1 rounded ${ratingColor(g.ratings.metacritic)}">
            MC ${g.ratings.metacritic}
          </span>
          <div class="absolute bottom-2 left-3 right-3 flex items-end justify-between gap-2">
            <h3 class="font-semibold text-base leading-tight line-clamp-2 drop-shadow">${g.name}</h3>
            <span class="text-xs text-neutral-300 shrink-0">${g.releaseDate.slice(0,4)}</span>
          </div>
        </div>

        <div class="p-4 flex-1 flex flex-col gap-3">
          <div class="flex flex-wrap gap-1.5">
            ${g.tags.slice(0,3).map(t => `<span class="text-[11px] px-2 py-0.5 rounded-full bg-neutral-800 text-neutral-300">${t}</span>`).join("")}
          </div>

          <div class="text-xs space-y-1.5">
            <div class="flex items-center gap-1.5 text-neutral-400 uppercase tracking-wider text-[10px]">
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z"/></svg>
              AI summary
            </div>
            ${g.reviewSummary.pros[0] ? `<p class="text-emerald-400/90 line-clamp-2">+ ${g.reviewSummary.pros[0]}</p>` : ""}
            ${g.reviewSummary.cons[0] ? `<p class="text-rose-400/90 line-clamp-2">− ${g.reviewSummary.cons[0]}</p>` : ""}
          </div>

          <span class="mt-auto text-xs text-neutral-400 group-hover:text-neutral-100 inline-flex items-center gap-1">
            View details
            <svg class="w-3 h-3 group-hover:translate-x-0.5 transition" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </span>
        </div>
      </a>
    `;

    document.getElementById("grid").innerHTML = games.map(tileHtml).join("");
  </script>
</body>
</html>
